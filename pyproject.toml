[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "container-scanner"
version = "0.1.0"
description = "Container Security Scanner — SBOM Generation, CVE Matching & Layer Attribution"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Team 15 - Container Security"},
]
dependencies = [
    "click>=8.0",
    "docker>=7.0",
    "rich>=13.0",
]

[project.scripts]
scanner = "scanner.main:main"

[tool.setuptools.packages.find]
include = ["scanner*"]
