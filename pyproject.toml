[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishnet"
version = "0.1.0"
description = "Phish Net — SBOM Generation, CVE Matching & Layer Attribution"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Team 15 - Container Security"},
]
dependencies = [
    "click>=8.0",
    "docker>=7.0",
    "rich>=13.0",
    "requests>=2.31.0",
]

[project.scripts]
phishnet = "phishnet.main:main"

[tool.setuptools.packages.find]
include = ["phishnet*"]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test*.py"]
python_functions = ["test*"]
